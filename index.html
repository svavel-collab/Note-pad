<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anteckningar</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="header">
    <h1>Anteckningar</h1>
  </div>

  <div class="input-container">
    <input type="text" id="note-title" placeholder="Titel..." />
    <textarea id="note-text" placeholder="Skriv en anteckning..."></textarea>
    <div class="button-group">
      <button id="save-btn" class="save-btn">Spara anteckning</button>
      <button id="clear-btn" class="clear-btn">Rensa fält</button>
    </div>
  </div>

  <div id="notes-list"></div>

  <script src="app.js"></script>
</body>
</html>
