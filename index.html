<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anteckningar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Listvy -->
  <div id="notes-list-view">
    <header class="app-header">
      <h1 id="app-title">Anteckningar</h1>
      <div class="header-actions">
        <button id="add-btn" aria-label="Skapa ny anteckning">+</button>
        <button id="settings-btn" class="hidden">⚙</button>
      </div>
    </header>

    <div class="search-container">
      <input type="text" id="search-input" placeholder="Sök anteckning...">
    </div>

    <div id="notes-list" class="notes-list"></div>
  </div>

  <!-- Redigeringsvy -->
  <div id="editor-view" class="hidden">
    <div class="editor">
      <input type="text" id="note-title-input" placeholder="Titel">
      <textarea id="note-content-input" placeholder="Skriv din anteckning här..."></textarea>
      
      <div class="editor-actions">
        <button id="cancel-btn">Avbryt</button>
        <button id="save-btn">Spara</button>
      </div>
    </div>
  </div>

  <!-- Undo Toast -->
  <div id="toast" class="toast hidden">
    <span>Anteckning raderad</span>
    <button id="undo-btn">Ångra</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
