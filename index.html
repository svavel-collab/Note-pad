<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Anteckningar</title>
  
  <!-- PWA & Web App Inställningar -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- CSS med versionsparameter för att krossa gammal cache -->
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

  <div class="app-header">
    <h1 id="app-title">Anteckningar</h1>
    <div class="header-actions">
      <button id="add-btn" aria-label="Skapa ny anteckning">+</button>
    </div>
  </div>

  <div class="search-container">
    <input type="text" id="search-input" placeholder="Sök anteckningar...">
  </div>

  <div id="notes-list" class="notes-list">
    <!-- Anteckningsrader läggs till dynamiskt via app.js -->
  </div>

  <div id="editor" class="editor hidden">
    <input type="text" id="note-title-input" placeholder="Titel">
    <textarea id="note-content-input" placeholder="Skriv din anteckning här..."></textarea>
    <div class="editor-actions">
      <button id="save-btn">Spara</button>
      <button id="cancel-btn">Avbryt</button>
    </div>
  </div>

  <div id="toast" class="toast hidden">
    <span>Anteckning raderad</span>
    <button id="undo-btn">Ångra</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
