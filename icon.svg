<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Blå stilren bakgrund med rundade hörn -->
  <rect width="512" height="512" rx="112" fill="#007AFF"/>
  
  <!-- Vitt anteckningsblock -->
  <rect x="136" y="106" width="240" height="300" rx="20" fill="#FFFFFF"/>
  
  <!-- Linjer på blocket -->
  <line x1="186" y1="180" x2="326" y2="180" stroke="#007AFF" stroke-width="16" stroke-linecap="round"/>
  <line x1="186" y1="236" x2="326" y2="236" stroke="#007AFF" stroke-width="16" stroke-linecap="round"/>
  <line x1="186" y1="292" x2="266" y2="292" stroke="#007AFF" stroke-width="16" stroke-linecap="round"/>
  
  <!-- Rygg/spiral-detalj till vänster -->
  <rect x="116" y="150" width="40" height="16" rx="8" fill="#E5E5EA"/>
  <rect x="116" y="210" width="40" height="16" rx="8" fill="#E5E5EA"/>
  <rect x="116" y="270" width="40" height="16" rx="8" fill="#E5E5EA"/>
  <rect x="116" y="330" width="40" height="16" rx="8" fill="#E5E5EA"/>
</svg>
